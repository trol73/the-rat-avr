plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.3.21'
}

group = 'ru.trolsoft.therat'
version = '0.3'

repositories {
    mavenCentral()
}

kotlin {
    jvm {
        compilations.all {
            kotlinOptions.jvmTarget = '21'
        }
    }

    // Kotlin Native targets - all platforms
    linuxX64()
    linuxArm64()
    macosX64()
    macosArm64()
    mingwX64()

    sourceSets {
        commonMain {
            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-io-core:0.9.2'
            }
        }
        commonTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
            }
        }
        jvmMain {
            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-io-core-jvm:0.9.2'
            }
        }
        jvmTest {
            dependencies {
                implementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
                implementation 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
                implementation 'io.kotest:kotest-assertions-core-jvm:6.2.6'
                implementation 'io.kotest:kotest-runner-junit5-jvm:6.2.6'
            }
        }
    }
}

// Configure executables for all native targets
kotlin.targets.withType(org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget).configureEach {
    binaries {
        executable('ratc') {
            entryPoint = 'ru.trolsoft.therat.main'
        }
    }
}

kotlin.sourceSets {
    commonMain {
        kotlin.srcDir('src/commonMain/kotlin')
        resources.srcDir('src/commonMain/resources')
    }
    commonTest {
        kotlin.srcDir('src/commonTest/kotlin')
    }
    jvmMain {
        kotlin.srcDir('src/jvmMain/kotlin')
        resources.srcDir('src/jvmMain/resources')
    }
    jvmTest {
        kotlin.srcDir('src/jvmTest/kotlin')
        resources.srcDir('src/jvmTest/resources')
    }
    linuxMain {
        kotlin.srcDir('src/linuxMain/kotlin')
    }
    macosMain {
        kotlin.srcDir('src/macosMain/kotlin')
    }
    mingwMain {
        kotlin.srcDir('src/mingwMain/kotlin')
    }
}

tasks.named('jvmTest') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
}

tasks.register('fatJar', org.gradle.jvm.tasks.Jar) {
    dependsOn 'jvmJar'
    archiveBaseName.set('the-rat')
    archiveVersion.set(version)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set('all')

    manifest {
        attributes 'Main-Class': 'ru.trolsoft.therat.RatKt'
    }

    from {
        configurations.jvmRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with tasks.named('jvmJar').get()
}
